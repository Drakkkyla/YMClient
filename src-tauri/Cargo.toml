[package]
name = "ymclient"
version = "0.1.0"
description = "Alternative Yandex Music client"
edition = "2021"

[lib]
name = "ymclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Native AVAudioEngine player for iOS (no-op on desktop).
tauri-plugin-ymaudio = { path = "plugins/ymaudio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md5 = "0.7"
url = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["time"] }
# lyrics request signing
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "0.2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
