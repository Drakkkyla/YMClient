[package]
name = "ymprobe"
version = "0.1.0"
description = "iOS background-playback probe for YMClient"
edition = "2021"

[lib]
name = "ymprobe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md5 = "0.7"
percent-encoding = "2"
tokio = { version = "1", features = ["time"] }
