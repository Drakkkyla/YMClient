# Codemagic builds:
#   ios       → unsigned YMClient.ipa (sideload with Sideloadly)
#   macos     → universal (Apple Silicon + Intel) YMClient .dmg
#   ios-probe → unsigned YMProbe.ipa (background-playback test app)
#   vault     → unsigned Hush.ipa (private encrypted photo vault, vault/)
# Start one from the Codemagic dashboard ("Start new build" → pick the workflow);
# the .ipa / .dmg shows up under the build's Artifacts.
workflows:
  ios:
    name: YMClient iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: lts
    scripts:
      - name: Install Rust
        script: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-ios

      - name: Install npm dependencies
        script: npm ci

      - name: Build unsigned YMClient.ipa
        script: bash scripts/build-unsigned-ipa.sh

    artifacts:
      - YMClient.ipa

  macos:
    name: YMClient macOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: lts
    scripts:
      - name: Install Rust
        script: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          # Each script runs in a fresh shell; CM_ENV carries PATH over to the next steps.
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install npm dependencies
        script: npm ci

      - name: Build .dmg
        script: npm run tauri build -- --target universal-apple-darwin

    artifacts:
      - src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  ios-probe:
    name: YMProbe iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: ios-probe
    environment:
      node: lts
    scripts:
      - name: Install Rust
        script: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-ios

      - name: Install npm dependencies
        script: npm ci

      - name: Build unsigned .ipa
        script: bash scripts/build-unsigned-ipa.sh

    artifacts:
      - "**/YMProbe.ipa"

  vault:
    name: Hush iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Build unsigned Hush.ipa
        script: bash vault/scripts/build-ipa.sh
    artifacts:
      - vault/Hush.ipa
